# Input overrides for the kitchen "hardened" container suite (kitchen.container.yml).
# Every other input keeps its default from inspec.yml.

# Controls that are known to consistently have long run times can be disabled with this input
disable_slow_controls: false

# SV-257978, SV-257996, SV-258003
# A hardened container is not allowed to run an OpenSSH server
allow_container_openssh_server: false

# SV-257978
# Containers do not rely on physical protections for the SSH requirement
physical_protections_employed: false
